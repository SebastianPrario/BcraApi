version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bcra-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: bcra_alerts
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bcra-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/bcra_alerts
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      API_URL_ENTIDADES: https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/
      API_URL_CHEQUESRECHAZADOS: https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/ChequesRechazados/
      THIS_APP_URL: ${THIS_APP_URL}
      FRONTEND_TOKEN: ${FRONTEND_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
